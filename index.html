<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pulse: Cyber Dash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            text-align: center;
            position: relative;
            width: 400px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-box {
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        canvas {
            background: #111827;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        #instructions {
            margin-top: 8px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="scoreboard">
            <div class="score-box">Sᴄᴏʀᴇ: <span id="currentScore">0</span></div>
            <div class="score-box">Hɪɢʜᴇʀ: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="460"></canvas>
        <div id="instructions">Tap Screen or Press **Space / Up Arrow** to Jump</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK5S695EtUotQh7McfGA539z23hfkqQnM",
            authDomain: "sukuna-chat.firebaseapp.com",
            projectId: "sukuna-chat",
            storageBucket: "sukuna-chat.firebasestorage.app",
            messagingSenderId: "37564963680",
            appId: "1:37564963680:web:ba9fcb336cf11a057f1c05",
            databaseURL: "https://sukuna-chat-default-rtdb.firebaseio.com/"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.log("Firebase offline mode active.");
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let highScore = localStorage.getItem("cyberHighScore") || 0;
        document.getElementById("highScore").innerText = highScore;

        if (db) {
            const dbRef = ref(db);
            get(child(dbRef, 'leaderboard/player_best')).then((snapshot) => {
                if (snapshot.exists()) {
                    let cloudScore = snapshot.val().score;
                    if (cloudScore > highScore) {
                        highScore = cloudScore;
                        localStorage.setItem("cyberHighScore", highScore);
                        document.getElementById("highScore").innerText = highScore;
                    }
                }
            }).catch((error) => { console.error(error); });
        }

        let gameState = "start"; 
        let player = {
            x: 50,
            y: 230,
            radius: 14,
            gravity: 0.35,   
            lift: -6.5,      
            velocity: 0
        };

        let obstacles = [];
        let frameCount = 0;
        let colorHue = 0; 

        let cycleTimer = 0;
        let isNight = false;
        
        const stars = [
            {x: 50, y: 80, size: 1.5},
            {x: 120, y: 40, size: 2},
            {x: 200, y: 100, size: 1},
            {x: 280, y: 50, size: 2.5},
            {x: 350, y: 90, size: 1.5},
            {x: 90, y: 180, size: 2},
            {x: 320, y: 200, size: 1}
        ];

        function drawBackground() {
            if (isNight) {
                ctx.fillStyle = "#050811";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.beginPath();
                ctx.arc(330, 70, 20, 0, Math.PI * 2);
                ctx.fillStyle = "#e2e8f0";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ffffff";
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#ffffff";
                stars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.closePath();
                });
            } else {
                ctx.fillStyle = "#111827";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function drawPlayer() {
            let currentColor = `hsl(${colorHue}, 100%, 50%)`;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = currentColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = currentColor;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawObstacles() {
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0055";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
            ctx.shadowBlur = 0;
        }

        function drawScreenText() {
            ctx.fillStyle = isNight ? "rgba(5, 8, 17, 0.88)" : "rgba(17, 24, 39, 0.88)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center";
            ctx.shadowBlur = 15;

            if (gameState === "start") {
                ctx.fillStyle = "#00f3ff";
                ctx.shadowColor = "#00f3ff";
                ctx.font = "bold 28px 'Segoe UI', sans-serif";
                ctx.fillText("TAP TO PLAY", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.fillStyle = "#9ca3af";
                ctx.font = "14px 'Segoe UI', sans-serif";
                ctx.shadowBlur = 0;
                ctx.fillText("Get ready for the cyber dash", canvas.width / 2, canvas.height / 2 + 30);
            } else if (gameState === "gameover") {
                ctx.fillStyle = "#ff0055";
                ctx.shadowColor = "#ff0055";
                ctx.font = "bold 30px 'Segoe UI', sans-serif";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 35);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px 'Segoe UI', sans-serif";
                ctx.shadowBlur = 0;
                ctx.fillText("Score: " + Math.floor(score), canvas.width / 2, canvas.height / 2 + 5);
                ctx.fillText("Tap to Play Again", canvas.width / 2, canvas.height / 2 + 45);
            }
            ctx.shadowBlur = 0;
            ctx.textAlign = "left";
        }

        function updateGame() {
            if (gameState !== "playing") return;

            cycleTimer++;
            if (cycleTimer >= 3600) {
                isNight = !isNight;
                cycleTimer = 0;
            }

            drawBackground();

            player.velocity += player.gravity;
            player.y += player.velocity;

            colorHue = (colorHue + 1.5) % 360;

            if (player.y + player.radius > canvas.height) {
                player.y = canvas.height - player.radius;
                gameOver();
            }
            if (player.y - player.radius < 0) {
                player.y = player.radius;
                player.velocity = 0;
            }

            if (frameCount % 140 === 0) {
                let obsHeight = Math.floor(Math.random() * 140) + 50; 
                let gap = 170; // Thora mazeed challenging gap aur choti width (24px)
                obstacles.push({ x: canvas.width, y: 0, width: 24, height: obsHeight, passed: false });
                obstacles.push({ x: canvas.width, y: obsHeight + gap, width: 24, height: canvas.height - (obsHeight + gap), passed: false });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= 2.8; 

                if (
                    player.x + player.radius > obstacles[i].x &&
                    player.x - player.radius < obstacles[i].x + obstacles[i].width &&
                    player.y + player.radius > obstacles[i].y &&
                    player.y - player.radius < obstacles[i].y + obstacles[i].height
                ) {
                    gameOver();
                }

                if (!obstacles[i].passed && obstacles[i].x < player.x) {
                    score += 0.5;
                    obstacles[i].passed = true;
                    document.getElementById("currentScore").innerText = Math.floor(score);
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            drawPlayer();
            drawObstacles();

            frameCount++;
            if (gameState === "playing") {
                requestAnimationFrame(updateGame);
            }
        }

        function gameOver() {
            gameState = "gameover";
            let finalScore = Math.floor(score);

            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem("cyberHighScore", highScore);
                document.getElementById("highScore").innerText = highScore;

                if (db) {
                    set(ref(db, 'leaderboard/player_best'), {
                        score: highScore,
                        timestamp: Date.now()
                    }).catch(err => console.log("Firebase sync error:", err));
                }
            }
            drawScreenText();
        }

        function resetGame() {
            score = 0;
            document.getElementById("currentScore").innerText = "0";
            player.y = 230;
            player.velocity = 0;
            obstacles = [];
            frameCount = 0;
            cycleTimer = 0;
            isNight = false;
            gameState = "playing";
            updateGame();
        }

        function handleAction() {
            if (gameState === "start") {
                gameState = "playing";
                updateGame();
            } else if (gameState === "playing") {
                player.velocity = player.lift;
            } else if (gameState === "gameover") {
                resetGame();
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                handleAction();
                e.preventDefault();
            }
        });

        canvas.addEventListener("click", () => {
            handleAction();
        });

        canvas.addEventListener("touchstart", (e) => {
            handleAction();
            e.preventDefault();
        }, { passive: false });

        drawBackground();
        drawPlayer();
        drawScreenText();
    </script>
</body>
    </html>
