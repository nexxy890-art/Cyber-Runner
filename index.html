<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pulse: Cyber Dash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050811;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        #top-bar {
            width: 400px;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .rating-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .star {
            font-size: 18px;
            color: #2d3748; 
            cursor: pointer;
            transition: transform 0.2s;
        }

        .star.active {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffea00;
            transform: scale(1.1);
        }

        #rating-emoji {
            font-size: 22px;
            margin-left: 6px;
            animation: pulseEmoji 1.5s infinite alternate;
        }

        @keyframes pulseEmoji {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)); }
        }

        #game-container {
            text-align: center;
            position: relative;
            width: 400px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-box {
            background: rgba(0, 243, 255, 0.08);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            color: #00f3ff;
        }

        canvas {
            background: #ffffff;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        #footer-bar {
            margin-top: 12px;
            width: 400px;
            text-align: center;
        }

        #copyLinkBtn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #050811;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: all 0.2s ease;
        }

        #copyLinkBtn:active {
            transform: scale(0.95);
        }

        #copyStatus {
            font-size: 12px;
            color: #10b981;
            margin-top: 5px;
            height: 15px;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="rating-container" id="starContainer">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        <div id="rating-emoji">😵</div>
    </div>

    <div id="game-container">
        <div class="scoreboard">
            <div class="score-box">Sᴄᴏʀᴇ: <span id="currentScore">0</span></div>
            <div class="score-box">Hɪɢʜᴇʀ: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="420"></canvas>
    </div>

    <div id="footer-bar">
        <button id="copyLinkBtn">Copy Link</button>
        <div id="copyStatus"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK5S695EtUotQh7McfGA539z23hfkqQnM",
            authDomain: "sukuna-chat.firebaseapp.com",
            projectId: "sukuna-chat",
            storageBucket: "sukuna-chat.firebasestorage.app",
            messagingSenderId: "37564963680",
            appId: "1:37564963680:web:ba9fcb336cf11a057f1c05",
            databaseURL: "https://sukuna-chat-default-rtdb.firebaseio.com/"
        };

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.log("Firebase offline mode active.");
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const emojis = { 0: "😵", 1: "🥺", 2: "😟", 3: "🙂", 4: "😉", 5: "😊" };
        const stars = document.querySelectorAll(".star");
        const emojiDisplay = document.getElementById("rating-emoji");

        let currentRating = localStorage.getItem("cyberUserRating") || 0;
        updateStarsUI(currentRating);

        stars.forEach(star => {
            star.addEventListener("click", () => {
                currentRating = parseInt(star.getAttribute("data-value"));
                localStorage.setItem("cyberUserRating", currentRating);
                updateStarsUI(currentRating);
            });
        });

        function updateStarsUI(rating) {
            stars.forEach(s => {
                let val = parseInt(s.getAttribute("data-value"));
                if (val <= rating) {
                    s.classList.add("active");
                } else {
                    s.classList.remove("active");
                }
            });
            emojiDisplay.innerText = emojis[rating] || "😵";
        }

        document.getElementById("copyLinkBtn").addEventListener("click", () => {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl).then(() => {
                document.getElementById("copyStatus").innerText = "Link Copied Successfully!";
                setTimeout(() => {
                    document.getElementById("copyStatus").innerText = "";
                }, 2500);
            }).catch(err => {
                console.error("Failed to copy link: ", err);
            });
        });

        let score = 0;
        let highScore = localStorage.getItem("cyberHighScore") || 0;
        document.getElementById("highScore").innerText = highScore;

        if (db) {
            const dbRef = ref(db);
            get(child(dbRef, 'leaderboard/player_best')).then((snapshot) => {
                if (snapshot.exists()) {
                    let cloudScore = snapshot.val().score;
                    if (cloudScore > highScore) {
                        highScore = cloudScore;
                        localStorage.setItem("cyberHighScore", highScore);
                        document.getElementById("highScore").innerText = highScore;
                    }
                }
            }).catch((error) => { console.error(error); });
        }

        let gameState = "start"; 
        let player = {
            x: 50,
            y: 210,
            radius: 14,
            gravity: 0.35,   
            lift: -6.5,      
            velocity: 0
        };

        let obstacles = [];
        let frameCount = 0;
        let colorAngle = 0; 

        let nightFactor = 0; 
        let cycleProgress = 0;
        
        const nightStars = [
            {x: 50, y: 50, size: 1.5},
            {x: 130, y: 30, size: 2},
            {x: 210, y: 70, size: 1},
            {x: 290, y: 40, size: 2.5},
            {x: 360, y: 60, size: 1.5},
            {x: 90, y: 130, size: 2},
            {x: 320, y: 150, size: 1}
        ];

        function drawBackground() {
            let r = Math.floor(255 * (1 - nightFactor) + 3 * nightFactor);
            let g = Math.floor(255 * (1 - nightFactor) + 5 * nightFactor);
            let b = Math.floor(255 * (1 - nightFactor) + 11 * nightFactor);
            
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (nightFactor > 0.05) {
                ctx.save();
                ctx.globalAlpha = nightFactor;

                ctx.beginPath();
                ctx.arc(330, 50, 18, 0, Math.PI * 2);
                ctx.fillStyle = "#e2e8f0";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ffffff";
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "#ffffff";
                nightStars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.closePath();
                });
                ctx.restore();
            }
        }

        function drawPlayer() {
            let gradientX = player.x + Math.cos(colorAngle) * 8;
            let gradientY = player.y + Math.sin(colorAngle) * 8;
            let grad = ctx.createRadialGradient(gradientX, gradientY, 2, player.x, player.y, player.radius + 6);
            
            grad.addColorStop(0, "#ffffff");
            grad.addColorStop(0.3, "#00f3ff");
            grad.addColorStop(0.6, "#9d00ff");
            grad.addColorStop(1, "#ff0055");

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.shadowBlur = 18;
            ctx.shadowColor = "#00f3ff";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawObstacles() {
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0055";
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });
            ctx.shadowBlur = 0;
        }

        function drawScreenText() {
            let r = Math.floor(255 * (1 - nightFactor) + 11 * nightFactor);
            let g = Math.floor(255 * (1 - nightFactor) + 15 * nightFactor);
            let b = Math.floor(255 * (1 - nightFactor) + 25 * nightFactor);
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.88)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center";
            ctx.shadowBlur = 15;

            if (gameState === "start") {
                ctx.fillStyle = "#007acc";
                ctx.shadowColor = "#00f3ff";
                ctx.font = "bold 26px 'Segoe UI', sans-serif";
                ctx.fillText("TAP TO PLAY", canvas.width / 2, canvas.height / 2 - 10);
                
                ctx.fillStyle = "#4b5563";
                ctx.font = "13px 'Segoe UI', sans-serif";
                ctx.shadowBlur = 0;
                ctx.fillText("Navigate through tight spaces", canvas.width / 2, canvas.height / 2 + 25);
            } else if (gameState === "gameover") {
                ctx.fillStyle = "#ff0055";
                ctx.shadowColor = "#ff0055";
                ctx.font = "bold 28px 'Segoe UI', sans-serif";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.fillStyle = "#1f2937";
                ctx.font = "17px 'Segoe UI', sans-serif";
                ctx.shadowBlur = 0;
                ctx.fillText("Score: " + Math.floor(score), canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("Tap to Play Again", canvas.width / 2, canvas.height / 2 + 45);
            }
            ctx.shadowBlur = 0;
            ctx.textAlign = "left";
        }

        function updateGame() {
            if (gameState !== "playing") return;

            cycleProgress += 0.0012; 
            nightFactor = (Math.sin(cycleProgress) + 1) / 2; 

            drawBackground();

            player.velocity += player.gravity;
            player.y += player.velocity;

            colorAngle += 0.03;

            if (player.y + player.radius > canvas.height) {
                player.y = canvas.height - player.radius;
                gameOver();
            }
            if (player.y - player.radius < 0) {
                player.y = player.radius;
                player.velocity = 0;
            }

            if (frameCount % 130 === 0) {
                let obsHeight = Math.floor(Math.random() * 130) + 45; 
                let gap = 135; 
                obstacles.push({ x: canvas.width, y: 0, width: 22, height: obsHeight, passed: false });
                obstacles.push({ x: canvas.width, y: obsHeight + gap, width: 22, height: canvas.height - (obsHeight + gap), passed: false });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= 2.8; 

                if (
                    player.x + player.radius > obstacles[i].x &&
                    player.x - player.radius < obstacles[i].x + obstacles[i].width &&
                    player.y + player.radius > obstacles[i].y &&
                    player.y - player.radius < obstacles[i].y + obstacles[i].height
                ) {
                    gameOver();
                }

                if (!obstacles[i].passed && obstacles[i].x < player.x) {
                    score += 0.5;
                    obstacles[i].passed = true;
                    document.getElementById("currentScore").innerText = Math.floor(score);
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            drawPlayer();
            drawObstacles();

            frameCount++;
            if (gameState === "playing") {
                requestAnimationFrame(updateGame);
            }
        }

        function gameOver() {
            gameState = "gameover";
            let finalScore = Math.floor(score);

            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem("cyberHighScore", highScore);
                document.getElementById("highScore").innerText = highScore;

                if (db) {
                    set(ref(db, 'leaderboard/player_best'), {
                        score: highScore,
                        timestamp: Date.now()
                    }).catch(err => console.log("Firebase sync error:", err));
                }
            }
            drawScreenText();
        }

        function resetGame() {
            score = 0;
            document.getElementById("currentScore").innerText = "0";
            player.y = 210;
            player.velocity = 0;
            obstacles = [];
            frameCount = 0;
            cycleProgress = 0;
            nightFactor = 0;
            gameState = "playing";
            updateGame();
        }

        function handleAction() {
            if (gameState === "start") {
                gameState = "playing";
                updateGame();
            } else if (gameState === "playing") {
                player.velocity = player.lift;
            } else if (gameState === "gameover") {
                resetGame();
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                handleAction();
                e.preventDefault();
            }
        });

        canvas.addEventListener("click", () => {
            handleAction();
        });

        canvas.addEventListener("touchstart", (e) => {
            handleAction();
            e.preventDefault();
        }, { passive: false });

        drawBackground();
        drawPlayer();
        drawScreenText();
    </script>
</body>
    </html>
